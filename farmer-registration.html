<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CROP LAND - Farmer Registration</title>

    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="chatbot.css">

</head>

<body>

    <header>

        <div class="logo">
            🌾 CROP LAND
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="registration.html">Back</a>
        </nav>

    </header>


    <main class="registration">

        <h1>Farmer Registration</h1>

        <p>Create your CropLand farmer account</p>


        <form class="registration-form" id="farmerRegistrationForm">

            <label>Full Name</label>

                 <input id="farmerName"
                     type="text"
                   placeholder="Enter your full name"
                   required>


            <label>Mobile Number</label>

            <input type="tel"
                   placeholder="Enter mobile number"
                   required>


            <label>Email</label>

                        <input id="farmerEmail"
                                     type="email"
                                     placeholder="Enter email address"
                                     required>

            <label>Farm Location</label>

            <input type="text"
                   placeholder="Village, District, State"
                   required>


            <label>Farm Size</label>

            <input type="text"
                   placeholder="Example: 5 acres">


            <label>Password</label>

                 <input id="farmerPassword"
                     type="password"
                   placeholder="Create a password"
                   required>


            <button type="submit">
    Create Farmer Account
</button>

        </form>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
    <script src="chatbot.js"></script>

</body>

</html>
